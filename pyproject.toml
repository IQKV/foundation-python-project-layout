[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foundation-python-project-layout"
version = "0.1.0"
description = "A minimal Python microservice starter template built with FastAPI."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "IQKV", email = "dev@iqkv.com" }]
keywords = ["fastapi", "microservice", "python", "template", "docker"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.scripts]
foundation-python-project-layout = "foundation_python_project_layout.__main__:main"

[project.urls]
Homepage = "https://github.com/IQKV/foundation-python-project-layout"
Changelog = "https://github.com/IQKV/foundation-python-project-layout/blob/dev/CHANGELOG.md"

[dependency-groups]
dev = [
  "httpx>=0.28,<1.0",
  "mypy>=1.14,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<2.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/foundation_python_project_layout"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["A", "B", "C4", "E", "F", "I", "N", "PTH", "RUF", "SIM", "UP", "W"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
warn_unused_ignores = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["foundation_python_project_layout"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["if TYPE_CHECKING:", "if __name__ == .__main__.:", "pragma: no cover"]
